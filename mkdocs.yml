site_name: ugv_roarm_ws Documentation
site_description: ROS2 Humble colcon workspace for WaveShare UGV Rover + RoArm-M2 mobile manipulator
site_url: https://waveshareteam.github.io/ugv_roarm_ws

repo_name: ugv_roarm_ws
repo_url: https://github.com/waveshareteam/ugv_roarm_ws
edit_uri: edit/ros2-humble-develop-251125/docs/

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true

nav:
  - ugv_roarm_ws Documentation: index.md
  - Getting Started:
      - ROS2 Basics: ros2_basics.md
      - UGV Basics: ugv_basics.md
      - RoArm Basics: roarm_basics.md
      - UGV + RoArm Basics: ugv_roarm_basics.md
      - Installation: installation.md
  - Tutorials:
      - Robot Description: description.md
      - Hardware Driver: bringup.md
      - UGV Teleoperation: teleoperation.md
      - MoveIt2: moveit2.md
      - MoveIt Servo: moveit_servo.md
      - Vision: vision.md
      - Gazebo: gazebo.md
      - Command Control (optional): command_control.md
      - MTC Demo (optional): mtc_demo.md
  - Package Reference: packages.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-button.js
  - javascripts/image-lightbox.js
